name: e-commerce

services:
    php:
        container_name: e-commerce-php
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html:cached
        env_file:
            - .env.local
        environment:
            DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
        depends_on:
            database:
                condition: service_healthy
        networks:
            - e-commerce

    nginx:
        container_name: e-commerce-nginx
        image: nginx:1.27-alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html:cached
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - e-commerce

    database:
        container_name: e-commerce-database
        image: postgres:16-alpine
        env_file:
            - .env.local
        ports:
            - "5433:5432"
        volumes:
            - database_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - e-commerce

networks:
    e-commerce:
        name: e-commerce

volumes:
    database_data:
